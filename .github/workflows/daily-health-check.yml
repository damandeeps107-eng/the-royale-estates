name: 🏥 Daily Website Health Check

on:
  schedule:
    # Runs every day at 9:00 AM IST (3:30 AM UTC)
    - cron: "30 3 * * *"
  workflow_dispatch:
    # Also allow manual trigger anytime from GitHub

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Check Royale Estates Website

    steps:
      - name: 🔍 Check Main Website
        run: |
          STATUS=$(curl -o /dev/null -sL -w "%{http_code}" https://the-royale-estates.vercel.app)
          echo "Main Website HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ FAIL: Main website returned $STATUS"
            exit 1
          else
            echo "✅ PASS: Main website is online"
          fi

      - name: 🏠 Check Home Page
        run: |
          STATUS=$(curl -o /dev/null -sL -w "%{http_code}" https://the-royale-estates.vercel.app/home.html)
          echo "Home Page HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ FAIL: home.html returned $STATUS"
            exit 1
          else
            echo "✅ PASS: home.html is reachable"
          fi

      - name: 🗄️ Check Gist Database + Category Slugs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, ssl, sys, os

          GIST_TOKEN  = os.environ.get("GIST_TOKEN", "")
          GIST_ID     = "eebf5c328e2a6047fb9e71338a6836ba"
          VALID_SLUGS = {
              "warehouse-industrial",
              "commercial-office",
              "weekend-home-villas",
              "land-plots",
              "pre-leased"
          }

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          req = urllib.request.Request(
              f"https://api.github.com/gists/{GIST_ID}",
              headers={
                  "Authorization": f"token {GIST_TOKEN}",
                  "Accept": "application/vnd.github.v3+json",
                  "User-Agent": "royale-estates-healthcheck"
              }
          )
          with urllib.request.urlopen(req, context=ctx, timeout=15) as r:
              gist = json.loads(r.read())

          raw   = gist["files"]["properties.json"]["content"]
          props = json.loads(raw)
          print(f"✅ Gist DB online — {len(props)} properties found")

          bad = [p for p in props if p.get("category","").strip() not in VALID_SLUGS]
          if bad:
              print(f"❌ FAIL: {len(bad)} properties have invalid category slugs:")
              for p in bad:
                  print(f"   - [{p.get("title","?")[:40]}] → {p.get("category","")!r}")
              sys.exit(1)
          else:
              print("✅ All category slugs are canonical")

          incomplete = []
          for p in props:
              missing = [f for f in ["title","price","image","location"] if not p.get(f,"").strip()]
              if missing:
                  incomplete.append(f"  - [{p.get("title","?")[:30]}] missing: {", ".join(missing)}")
          if incomplete:
              print(f"⚠️ {len(incomplete)} incomplete properties:")
              for i in incomplete: print(i)
          else:
              print("✅ All properties complete")

          from collections import Counter
          cats = Counter(p.get("category","unknown") for p in props)
          print("\n📦 Category Distribution:")
          for slug in sorted(VALID_SLUGS):
              print(f"   {slug}: {cats.get(slug, 0)} properties")

          print("\n🎉 ALL CHECKS PASSED — Royale Estates is healthy!")
          PYEOF

      - name: ✅ Health Check Passed
        if: success()
        run: |
          echo "=================================================="
          echo "  THE ROYALE ESTATES — ALL SYSTEMS OK ✅"
          echo "  Date: $(date "+%Y-%m-%d %H:%M UTC")"
          echo "=================================================="

      - name: ❌ Issue Detected
        if: failure()
        run: |
          echo "=================================================="
          echo "  ❌ ROYALE ESTATES — ISSUE DETECTED!"
          echo "  Date: $(date "+%Y-%m-%d %H:%M UTC")"
          echo "  Check the logs above for details."
          echo "=================================================="
