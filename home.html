<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Temporarily Offline | The Royale Estates</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 560px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 48px 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .logo-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            margin: 0 auto 24px;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0284c7;
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
            transition: all 0.3s ease;
        }
        .contact-btn:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./assets/images/logo-circle.png" alt="The Royale Estates" class="logo-circle" onerror="this.style.display='none'">
        <div class="badge">🔒 Temporarily Offline</div>
        <h1>Website Under Scheduled Maintenance</h1>
        <p>The Royale Estates website is currently offline for scheduled maintenance. We will be back online shortly.</p>
        <a href="https://api.whatsapp.com/send?phone=919309035119&text=Hi%2C%20I%20have%20an%20inquiry%20regarding%20The%20Royale%20Estates" target="_blank" class="contact-btn">
            💬 Contact Official WhatsApp (+91 93090 35119)
        </a>
    </div>
</body>
</html>
